<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 1132" fill="currentColor" aria-hidden="true" focusable="false">
<!--
  Marchio Algora Studio, variante monocromatica.

  Ricavato dal marchio ufficiale a colori (img/marchi/Logo_uff_Algora.jpg):
  isolata la sola "A" con la curva che la attraversa, senza il lettering.
  Il blu e il rame dell'originale non appartengono alla palette del sito;
  questa variante prende invece il colore del testo che la circonda.

  fill="currentColor" fa si' che un solo file basti sia sulla pergamena
  chiara della barra di navigazione sia sull'inchiostro del pie' di pagina:
  non ci sono due varianti da tenere allineate fra loro.

  aria-hidden="true" perche' il marchio e' decorativo: il nome dello studio
  e' gia' presente come testo accanto, ed e' quello che i lettori di schermo
  devono annunciare. Senza questo attributo verrebbe annunciato due volte.
-->
